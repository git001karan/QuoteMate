name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.11.0

      - name: Run ruff check
        run: ruff check app/ scripts/ tests/

  test:
    name: Full automated test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # Tests build their own isolated SQLite databases under pytest's tmp_path
      # and override the get_db dependency; no production data, secrets, or
      # external services are used. Failures are reported by pytest's exit code.
      - name: Run full test suite with coverage
        env:
          ENVIRONMENT: test
        run: pytest tests/ -v --tb=short --cov=app --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  node:
    name: Node test/build (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker image build validation (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Build-only validation; the image is never pushed and no registry
      # credentials are configured.
      - name: Build Docker image
        run: docker build --tag quotemate:ci .

      - name: Upload Docker image tar as artifact
        run: |
          docker save -o quotemate-image.tar quotemate:ci
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: quotemate-image.tar
          retention-days: 7
